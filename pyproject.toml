[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twig-bb"
dynamic = ["version"]
description = "Twitchy GLitchy Bang Bang -- a PK3-based FPS built on OpenGLContext"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [
    { name = "Mike C. Fletcher", email = "mcfletch@vrplumber.com" }
]
keywords = [
    "PyOpenGL", "OpenGL", "OpenGLContext", "Quake", "BSP", "PK3", "map", "viewer",
    "FPS", "game",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Games/Entertainment :: First Person Shooters",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
]

# The download path runs through ``OpenGLContext.loaders.resolver``, so there is
# no ``requests`` dependency; the parsers are hand-written token scanners, so
# there is no ``simpleparse`` dependency either.
dependencies = [
    "numpy>=2.0",
    # The GLFW extra, not the bare engine: `twig_bb.viewer` sets
    # OPENGLCONTEXT_BACKEND=glfw before it imports anything, so the backend is
    # not a preference the game can do without. An install missing it reaches
    # the point of building the window class with no base class to build it on.
    "OpenGLContext[glfw]>=3.0.0a5",
    "omi_audio>=0.2.0a1",
    "omi_physics>=0.4.0",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]
# omi_audio itself is a dependency -- the sound design in twig_bb.combatsound
# is written against its model and its synthesiser -- and it mixes happily with
# no backend at all.  What is optional is the backend that reaches a sound card,
# and its absence is silence, never an error.  The reason it is optional is
# concrete and not a preference: miniaudio publishes **no Linux ARM64 wheel**, so
# making it hard would turn every linux/arm64 install -- increasingly the default
# on Apple Silicon hosts -- into a source build wanting a compiler.  Re-check
# when a wheel appears; this is a response to a packaging gap and should not
# outlive it.  It is MIT, as is every decoder it bundles, which is why it is the
# only audio package this project takes: the convenient wrappers (libsndfile,
# PyAV, pydub via ffmpeg) are LGPL or worse and cannot be a dependency of a BSD
# library.
audio = ["omi_audio[playback]", "omi_audio[opus]"]
# Crunch (`.crn`) textures, which Unvanquished's packages use for most of their
# art (SPEC-CRN).  Optional because it is needed only for that content and
# because its absence is the ordinary "this build cannot decode that format"
# outcome the texture lookup already handles, not an error.  MIT, over a
# zlib-licensed reference decoder, so neither places any obligation on a BSD
# package -- the same test every dependency here has to pass.
crn = ["texture2ddecoder"]

[project.scripts]
twig-bb = "twig_bb.viewer:main"
twig-bb-hud = "twig_bb.hudsample:main"
twig-bb-fetch = "twig_bb.download:main"
twig-bb-bsp = "twig_bb.maploader:main"
twig-bb-bots = "twig_bb.botreview:main"

[project.urls]
Homepage = "https://github.com/mcfletch/twig-bb"

[tool.setuptools.dynamic]
version = {attr = "twig_bb.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["twig_bb*"]

# The stand-in weapon and item art ships with the package: it is CC0, so unlike
# the fetched OpenArena content there is nothing to carry onto a redistributor.
# The credits travel with the art rather than being collected elsewhere, so that
# an installed copy carries its own provenance -- see
# twig_bb/assets/weapons/CREDITS.md and twig_bb/assets/items/CREDITS.md.
[tool.setuptools.package-data]
twig_bb = [
    "packs.json",
    "assets/**/*.glb",
    "assets/**/*.png",
    "assets/**/CREDITS.md",
]

[tool.openglcontext-checks]
# The OGC rules (openglcontext-checks) this project is clean of, held by
# the workspace preflight. The others join as the project reaches zero of
# each; the counts are in openglcontext/plans/DEFECT-PREVENTION.md.
select = ["OGC101", "OGC102", "OGC111", "OGC121", "OGC141", "OGC223"]

[tool.openglcontext-checks.scopes]
# The readers of a map's raw form -- the BSP container and its lumps, shader
# scripts, packages, Crunch textures and external lightmaps -- which OGC101,
# OGC102 and OGC111 hold to checked values, sizes and paths. The modules that
# build geometry and visibility from the decoded lumps read typed record
# fields, whose ranges they check where they index with them.
loader = [
    "twig_bb/bspfile.py",
    "twig_bb/q3bsp.py",
    "twig_bb/q3shader.py",
    "twig_bb/dpk.py",
    "twig_bb/crnfile.py",
    "twig_bb/externallightmaps.py",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W", "F", "B", "PGH003", "PGH004", "PLE0604", "PLE0605",
    # An error is logged with its traceback, never a bare `except:`.
    "E722", "TRY400",
    # Datetimes carry a timezone.
    "DTZ",
    # No exec, eval, pickle, unchecked tar extraction or opening of arbitrary URL schemes.
    "S102", "S202", "S301", "S307", "S310",
    # Annotations use the builtin generics and `X | Y`, and abstract types come
    # from collections.abc.
    "UP006", "UP007", "UP035",
    # An `except Exception` either logs the traceback or names why it need not,
    # and nothing is swallowed with a bare pass or continue.
    "BLE001", "S110", "S112",
    # Every noqa silences something.
    "RUF100",
    # A mutable class attribute is a ClassVar the engine reads from the class,
    # or it is made immutable.
    "RUF012",
    # A private name is used only by its own module, or with a noqa saying why.
    "SLF001",
    # The raw forms the engine has an API for (banned-api, below).
    "TID251",
]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The workspace's banned-api list (openglcontext/plans/DEFECT-PREVENTION.md):
# the raw form, and the engine API that replaces it. The modules that
# implement a replacement, and the programs and tests that set the process
# environment, are exempted in per-file-ignores.
"urllib.request.urlopen".msg = "fetch through OpenGLContext.loaders.resolver: Resolver.fetch, fetch_url, or AllowedHosts.open_url for a service's own hosts"
"urllib.request.urlretrieve".msg = "fetch through OpenGLContext.loaders.resolver: fetch_to_cache, or AllowedHosts.open_url for a service's own hosts"
"tarfile.TarFile.extractall".msg = "unpack through OpenGLContext.contentpacks.archive.extract, which refuses a member that leaves the directory and caps the size"
"zipfile.ZipFile.extractall".msg = "unpack through OpenGLContext.contentpacks.archive.extract, which refuses a member that leaves the directory and caps the size"
"shutil.rmtree".msg = "replace or remove a directory through OpenGLContext.atomicfiles: staged_directory, replace_directory or remove_directory"
"shutil.move".msg = "move a finished file or directory into place through OpenGLContext.atomicfiles: staged_file, staged_directory or replace_directory"
"os.rename".msg = "os.rename refuses an existing target on Windows; use os.replace, or OpenGLContext.atomicfiles"
"os.environ".msg = "read a switch once, through OpenGLContext.renderoptions.env_flag_once / env_number_once, or in the program's start-up"
"os.getenv".msg = "read a switch once, through OpenGLContext.renderoptions.env_flag_once / env_number_once, or in the program's start-up"
"os._exit".msg = "exit through OpenGLContext.testing.process_exit.flush_and_exit, which flushes what was written first"
"time.time".msg = "ask OpenGLContext.events.systemtime.systemTime(), which a capture's fixed-step clock drives"

[tool.ruff.lint.per-file-ignores]
# A pytest fixture shared between two test modules is imported into the second
# one, and every test that asks for it then "redefines" that import as its own
# parameter.  That is how pytest fixtures are shared without a conftest, and a
# conftest is the wrong home for this one: importing it sets the GL renderer,
# profile and backend, which must not happen for the suite that needs no window.
"tests/test_items_gl.py" = ["F811"]
"tests/test_characters_gl.py" = ["F811"]
# The match as the player meets it is played out on a headless context: the
# viewer's own match methods (shooting, aiming, dying, the scoreboard) are
# bound onto a stand-in with no window and driven directly, so the module
# reaches the viewer's private methods and state throughout.
"tests/test_viewer_match.py" = ["SLF001"]
# The programs run by name set the environment the engine reads before it is
# imported, and a test sets the environment and clock of what it runs.
"twig_bb/botreview.py" = ["TID251"]
"twig_bb/hudsample.py" = ["TID251"]
"tools/*" = ["TID251"]
"tests/*" = ["TID251"]

[tool.mypy]
# The numpy stubs in this environment use `type` statements, which mypy only
# parses when told it is checking 3.12 or later.
python_version = "3.12"
# Every definition states its types, and a body is checked rather than skipped:
# an unannotated parameter is `Any`, and an `Any` travelling through a call is
# a check that reports success without having compared anything.
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = false
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "gl: needs a live OpenGL context",
    "sample: needs a sample map under tmp/ (skipped when absent)",
    "slow: whole-map loads and timing checks",
]

# uv decides whether its cached metadata for a source tree is still current
# from pyproject.toml, setup.py and setup.cfg alone. This project's version
# lives in twig_bb/__init__.py, so name that file too: without it a version
# bump leaves uv answering with the previous number, and a dependent requiring
# the new one resolves against PyPI rather than this checkout.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "twig_bb/__init__.py" }]
