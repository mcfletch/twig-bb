name: distributions

# The Windows bundle and the Debian package, built from a tag and from nothing
# else. `dist/v3.0.0` builds the distributions for 3.0.0 and attaches them to a
# release; an ordinary push builds nothing, because these artifacts are hundreds
# of megabytes and take a quarter of an hour between them.
#
# The tag is its own namespace, separate from the version bump in
# `twig_bb/__init__.py` that `release.yml` publishes to PyPI from: a source
# release and a binary release are then separate decisions, and a `dist/` tag
# can be moved or re-cut without meaning anything to PyPI. The version in it has
# to be the one in `twig_bb/__init__.py`: a bundle named after a version it does
# not contain is worse than no bundle.
#
#     git tag dist/v3.0.0 && git push origin dist/v3.0.0
#
# `workflow_dispatch` builds the same artifacts from whatever is checked out and
# attaches them to no release, which is how to test a change to the packaging
# without spending a version number on it.
on:
  push:
    tags:
      - 'dist/v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  # The interpreter the artifacts are built with and, for the Debian package,
  # the one they carry. One version for both, so a bug reported against either
  # is a bug in the same Python.
  PYTHON_VERSION: '3.12'

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - id: read
        name: Read the version, and check the tag agrees with it
        run: |
          VERSION=$(python - <<'EOF'
          import pathlib, re, sys
          text = pathlib.Path('twig_bb/__init__.py').read_text(encoding='utf-8')
          found = re.search(r'''^__version__\s*=\s*['"]([^'"]+)['"]''', text, re.M)
          if not found:
              sys.exit('no __version__ in twig_bb/__init__.py')
          print(found.group(1))
          EOF
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "twig-bb $VERSION"
          case "$GITHUB_REF" in
            refs/tags/dist/v*)
              TAGGED="${GITHUB_REF#refs/tags/dist/v}"
              if [ "$TAGGED" != "$VERSION" ]; then
                echo "::error::tag dist/v$TAGGED does not match __version__ $VERSION"
                exit 1
              fi
              ;;
          esac

  windows:
    name: windows bundle
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The stack first, from the file that is the one place either build says
      # where it comes from; then the game with the sound backend, which has a
      # Windows wheel and so is not the reason that extra is optional.
      - name: Install the game and the stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-stack.txt
          python -m pip install ".[audio]"
          python -m pip install pyinstaller

      # PyOpenGL and OpenGLContext carry their own PyInstaller hooks, found
      # through their `pyinstaller40` entry points, so the spec has only the
      # game to describe.
      - name: Freeze
        run: pyinstaller packaging/twig-bb.spec --noconfirm

      # A bundle that cannot start is not worth uploading, and the ways it
      # fails -- a plug-in module left behind, a shader that did not travel --
      # all show up on the first import. `--list-packs` reads the catalogue
      # that travels as package data, so it tests one more thing than `--help`.
      - name: Check the bundle runs
        run: |
          dist\twig-bb\twig-bb.exe --help
          dist\twig-bb\twig-bb.exe --list-packs
          dist\twig-bb\twig-bb-fetch.exe --help

      # The import graph PyInstaller built, for reading when the step above
      # says a module is missing.
      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: build/twig-bb/warn-twig-bb.txt

      - name: Zip it
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: Compress-Archive -Path dist/twig-bb/* -DestinationPath "twig-bb-$env:VERSION-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: twig-bb-*-windows-x64.zip
          if-no-files-found: error

  debian:
    name: debian package
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5

      # The interpreter that goes *in* the package: a relocatable build, which
      # is what lets an environment be assembled here and run from /opt.
      - name: Fetch the relocatable interpreter
        run: uv python install --install-dir runtime ${{ env.PYTHON_VERSION }}

      # `oglc-deb` is part of the engine, and `--no-deps` because the tool
      # imports nothing but the standard library: the engine's own dependencies
      # belong in the package being built, not on the machine building it.
      - name: Install the packaging tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps \
            "OpenGLContext @ git+https://github.com/mcfletch/openglcontext@develop" \
            "PyOpenGL @ git+https://github.com/mcfletch/pyopengl@develop"

      # The sound backend is a Recommends rather than a Depends: miniaudio opens
      # ALSA at run time and a machine without it gets silence, not an error.
      # Two names for the one library because the 64-bit time_t transition
      # renamed it, and a package that asked for only one of them would be
      # uninstallable on half the distributions it targets.
      - name: Build the package
        run: |
          oglc-deb --project . --extras audio \
            --runtime runtime \
            --requirement packaging/requirements-stack.txt \
            --command twig-bb --command twig-bb-fetch --command twig-bb-bsp \
            --recommends 'libasound2t64 | libasound2' \
            --menu-name 'Twitchy GLitchy Bang Bang' \
            --categories 'Game;ActionGame;' \
            --output dist

      # Installed with apt rather than dpkg so that the dependencies the
      # control file names are resolved -- which is also what tests that they
      # are the right ones.
      - name: Check it installs and the game starts
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/*.deb
          dpkg-deb --info ./dist/*.deb
          /usr/games/twig-bb --help
          /usr/games/twig-bb --list-packs

      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: release
    needs: [version, windows, debian]
    if: startsWith(github.ref, 'refs/tags/dist/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # `gh` is on the runner already, so the release is cut without trusting a
      # third-party action with a token that can write to the repository.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l artifacts/
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Twitchy GLitchy Bang Bang $VERSION" \
            --notes "Binary distributions of twig-bb $VERSION.

          * \`twig-bb-$VERSION-windows-x64.zip\` -- unzip it anywhere and run
            \`twig-bb.exe --list-packs\` to see what there is to play, then
            \`twig-bb.exe openarena:oa_dm1\`.
          * The \`.deb\` installs the game and the Python that runs it under
            \`/opt/twig-bb\`, with \`twig-bb\`, \`twig-bb-fetch\` and
            \`twig-bb-bsp\` in \`/usr/games\`.

          No map travels with either. The content is other people's, under
          licences of its own -- see NOTICES.md -- so the game fetches a pack
          on request and keeps it under your own application data."
