[tox]
envlist = py310, py311, py312, py313, py314
isolated_build = True

[testenv]
extras = dev
# An editable install rather than a built wheel: parts of the suite read files
# that live beside the package in the source tree, not inside it -- the
# checked-in ``NOTICES.md`` licence manifest (``test_notices``) and the sample
# maps under ``tmp/`` -- so they must see the repository layout.
package = editable
# The core dependencies (OpenGLContext 3.0.0a, pyopengl 4.0.0a, omi_audio
# 0.2.0a) are published only as pre-releases, which uv/pip skip by default;
# without this the resolver reports them "not available" and the env fails to
# build.  pip_pre is honoured by both the pip and the uv installers.
pip_pre = true
commands = pytest {posargs}
